# TEMP: https://github.com/lgtm-hq/lgtm-ci/issues/1207
# Use audit until step-security/harden-runner#708 is fixed.
# lgtm-ci external-consumer fixture — osv-scanner install path
# (reusable-vuln-suppression-check). Calls lgtm-hq/lgtm-ci at an exact SHA with
# NO tooling-ref, from outside the lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
#
# The fixture ships no .osv-scanner.toml, so the suppression check itself is a
# no-op; the job exists to prove the digest-verified osv-scanner install
# (lgtm-ci #1096) stays green on a plain ubuntu runner. The normal check uses
# audit temporarily; check-block preserves block-mode coverage when enabled.
# Set EGRESS_BLOCK_PROBES_ENABLED=true after harden-runner#708 is fixed.
---
name: fixture-vuln-suppression

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-vuln-suppression-check.yml@3244a18dcb302e55cafc1e0045967c5382040b74  # v0.78.1
    permissions:
      contents: write
      pull-requests: write
    with:
      egress-policy: audit  # TEMP: lgtm-hq/lgtm-ci#1207
      job-name: "Vulnerability Suppression Check"
      runner-image: ubuntu-24.04
      # Per ref: every lgtm-ci canary dispatches this on its own canary/<sha>
      # branch, and the default per-repository cleanup group let a third
      # concurrent canary supersede a queued run (cancelled gate, lgtm-ci
      # #1134). This fixture has no .osv-scanner.toml, so runs never open
      # cleanup PRs that the per-repository group would serialize.
      concurrency-scope: ${{ github.ref }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-block:
    if: vars.EGRESS_BLOCK_PROBES_ENABLED == 'true'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-vuln-suppression-check.yml@3244a18dcb302e55cafc1e0045967c5382040b74  # v0.78.1
    permissions:
      contents: write
      pull-requests: write
    with:
      egress-policy: block
      timeout-minutes: 8
      job-name: "Vulnerability Suppression Check (block probe)"
      runner-image: ubuntu-24.04
      # This optional check and the audit check cannot supersede one another.
      concurrency-scope: block-${{ github.ref }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
