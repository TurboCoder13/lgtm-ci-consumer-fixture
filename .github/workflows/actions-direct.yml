# lgtm-ci external-consumer fixture — direct composite-action path (#1075)
# Calls the four public runner actions with
# `uses: lgtm-hq/lgtm-ci/.github/actions/<name>@<sha>` from a consumer workflow
# that checks out ONLY its own source. There is no lgtm-ci checkout and no
# tooling-ref, so a nested `uses: ./.github/actions/setup-*` inside those
# composites has nothing to resolve against and the job fails with
# "Can't find 'action.yml'". Re-pin with: scripts/pin.sh <sha>
---
name: fixture-actions-direct

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Assert no lgtm-ci source in the workspace
        run: scripts/check-no-vendoring.sh
      - name: run-pytest (direct)
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/run-pytest@eae062ce40ce20fee8123f1ab609d4c5a57d8be2
        with:
          python-version: "3.12"
          working-directory: python
          coverage: "true"

  vitest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Assert no lgtm-ci source in the workspace
        run: scripts/check-no-vendoring.sh
      - name: run-vitest (direct)
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/run-vitest@eae062ce40ce20fee8123f1ab609d4c5a57d8be2
        with:
          package-manager: npm
          node-version: "22"
          working-directory: node
          coverage: "true"

  playwright:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Assert no lgtm-ci source in the workspace
        run: scripts/check-no-vendoring.sh
      - name: run-playwright (direct)
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/run-playwright@eae062ce40ce20fee8123f1ab609d4c5a57d8be2
        with:
          package-manager: bun
          node-version: "22"
          working-directory: playwright
          browser: chromium

  lighthouse:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Assert no lgtm-ci source in the workspace
        run: scripts/check-no-vendoring.sh
      - name: Serve the static site
        run: |
          python3 -m http.server 8080 --directory site >/tmp/http.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null
      - name: run-lighthouse (direct)
        id: lighthouse
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/run-lighthouse@eae062ce40ce20fee8123f1ab609d4c5a57d8be2
        with:
          # @lhci/cli is a consumer prerequisite (#1077): it lives in
          # lighthouse/package.json and is resolved through npm, never installed
          # by the action.
          package-manager: npm
          working-directory: lighthouse
          url: http://127.0.0.1:8080/
          # Three runs per URL (lighthouserc.json), so the representative
          # (median) run LHCI names in manifest.json is not necessarily the
          # newest report file (lgtm-hq/lgtm-ci#1088).
          config-path: lighthouserc.json
          node-version: "22"
          # The point is resolution, not scoring; keep thresholds lenient so a
          # slow runner cannot turn a resolution pass into a score failure.
          threshold-performance: "50"
          threshold-accessibility: "50"
          threshold-best-practices: "50"
          threshold-seo: "50"
      - name: Assert the representative run was scored (lgtm-hq/lgtm-ci#1088)
        shell: bash
        env:
          RESULTS_PATH: ${{ steps.lighthouse.outputs.results-path }}
          PASSED: ${{ steps.lighthouse.outputs.passed }}
          PERFORMANCE: ${{ steps.lighthouse.outputs.performance }}
        run: |
          set -euo pipefail
          manifest=lighthouse/lighthouse-reports/manifest.json
          runs="$(jq length "$manifest")"
          rep="$(jq -r '[.[] | select(.isRepresentativeRun)][0].jsonPath' "$manifest")"
          echo "runs=${runs} representative=${rep} scored=${RESULTS_PATH}"
          [[ "$runs" -ge 2 ]] ||
            { echo "::error::expected a multi-run manifest, got ${runs} run(s)"; exit 1; }
          [[ -n "$RESULTS_PATH" && "$(realpath "$RESULTS_PATH")" == "$(realpath "$rep")" ]] ||
            { echo "::error::scored '${RESULTS_PATH}', not the representative run ${rep}"; exit 1; }
          [[ "$PASSED" == "true" && "$PERFORMANCE" -gt 0 ]] ||
            { echo "::error::passed=${PASSED} performance=${PERFORMANCE}"; exit 1; }
