# TEMP: https://github.com/lgtm-hq/lgtm-ci/issues/1207
# Use audit until step-security/harden-runner#708 is fixed.
# lgtm-ci external-consumer fixture — Rust test path (reusable-rust-test)
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
#
# `test` installs cargo-nextest; `coverage` additionally installs
# cargo-llvm-cov. Both come from digest-verified release archives
# (lgtm-ci #1096), so this workflow is the positive proof for both installs.
---
name: fixture-rust

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-rust-test.yml@ddd98f9f9c9024cfbe85c3b9704f3d5cbd899346  # v0.78.1
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      egress-policy: audit  # TEMP: lgtm-hq/lgtm-ci#1207
      job-name: "Rust Tests"
      rust-toolchain: stable
      working-directory: rust
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04

  coverage:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-rust-test.yml@ddd98f9f9c9024cfbe85c3b9704f3d5cbd899346  # v0.78.1
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      egress-policy: audit  # TEMP: lgtm-hq/lgtm-ci#1207
      job-name: "Rust Coverage"
      rust-toolchain: stable
      working-directory: rust
      coverage: true
      publish-test-summary: false
      runner-image: ubuntu-24.04
