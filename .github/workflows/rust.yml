# lgtm-ci external-consumer fixture — Rust test path (reusable-rust-test)
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-rust

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-rust-test.yml@49f89e4a0ccc8de7e0ae8ba35b9ec4845c80ada1
    permissions:
      contents: read
      pull-requests: write
    with:
      job-name: "Rust Tests"
      rust-toolchain: stable
      working-directory: rust
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
