# lgtm-ci external-consumer fixture — Rust test path (reusable-rust-test)
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
#
# `test` installs cargo-nextest; `coverage` additionally installs
# cargo-llvm-cov. Both come from digest-verified release archives
# (lgtm-ci #1096), so this workflow is the positive proof for both installs.
---
name: fixture-rust

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-rust-test.yml@c433bd309ef6e0936623e84913fa4a287c22df9a
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Rust Tests"
      rust-toolchain: stable
      working-directory: rust
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04

  coverage:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-rust-test.yml@c433bd309ef6e0936623e84913fa4a287c22df9a
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Rust Coverage"
      rust-toolchain: stable
      working-directory: rust
      coverage: true
      publish-test-summary: false
      runner-image: ubuntu-24.04
