# lgtm-ci external-consumer fixture — direct build-python-package path (#1087)
# A DEFAULT actions/checkout (shallow, depth 1, credentials kept) followed by
# `uses: lgtm-hq/lgtm-ci/.github/actions/build-python-package@<sha>` with
# ensure-tag-on-default-branch left at its default (true).
#
# On a tag event the shallow checkout fetches only the tag, so there is no
# refs/remotes/origin/main and the preflight must fetch that branch itself;
# before lgtm-ci #1087 it died with "Default branch ref ... is unavailable".
# On a branch event (dispatch/push on main) actions/checkout does create
# refs/remotes/origin/main, so the ref is deleted first to reproduce the
# tag-event shape from a main dispatch. verify-tag-version stays off: fixture
# tags do not track python/pyproject.toml's version. On non-main branches
# (the lgtm-ci external canary's `canary/<sha>`) the on-default-branch check
# is off, since such a commit is never on main. Re-pin with:
# scripts/pin.sh <sha>
---
name: fixture-build-python-direct

"on":
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*", "fixture-*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Deliberately no `with:` — default fetch-depth (1) and
      # persist-credentials (true), the setup the public docs show.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert no lgtm-ci source in the workspace
        run: scripts/check-no-vendoring.sh
      - name: Reproduce the tag-event checkout shape
        env:
          REF: ${{ github.ref }}
        run: |
          test "$(git rev-parse --is-shallow-repository)" = "true"
          case "$REF" in
            refs/tags/*) echo "tag event: checkout fetched only the tag" ;;
            *) git update-ref -d refs/remotes/origin/main
               echo "branch event: dropped refs/remotes/origin/main to match a tag checkout" ;;
          esac
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::refs/remotes/origin/main exists; this fixture needs a shallow checkout without it"
            exit 1
          fi
          echo "shallow checkout confirmed; refs/remotes/origin/main absent"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: build-python-package (direct)
        id: build
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/build-python-package@eae062ce40ce20fee8123f1ab609d4c5a57d8be2
        with:
          working-directory: python
          verify-tag-version: "false"
          # The lgtm-ci external canary runs this probe on a throwaway
          # `canary/<sha>` branch whose commit is, by construction, not on
          # main; there the preflight would correctly abort. Enforce the
          # on-default-branch check only where it can hold (main and tags).
          ensure-tag-on-default-branch: ${{ startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' }}
      - name: Show outputs
        env:
          NAME: ${{ steps.build.outputs.package-name }}
          VERSION: ${{ steps.build.outputs.version }}
        run: echo "built ${NAME} ${VERSION}"
