# lgtm-ci external-consumer fixture — NEGATIVE permission test (#735, #736)
# Calls reusable-test-python with `contents: read` only, omitting the
# documented `actions: read` (#803) and `pull-requests: write`. The reusable's publish job declares
# pull-requests: write, and GitHub validates that a called workflow's
# permissions are a subset of the caller's at parse time — so the expected
# outcome is a startup_failure before any job runs. If this run instead
# starts (and passes or fails inside a job), the documented minimum in
# lgtm-ci is wrong and that is a finding for #735/#736.
# workflow_dispatch only: a run that is expected to fail must not redden main.
# Dispatched by perms-negative-probe.yml, which asserts the failure and deletes this
# run after a pass, so an expected failure does not stay red on the Actions page.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-perms-negative

"on":
  workflow_dispatch:

permissions: {}

jobs:
  contents-read-only:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@2134b70042dc51eb5484f7bdedf329680f66f8ea
    permissions:
      contents: read
    with:
      job-name: "Python Tests (contents:read only)"
      python-version: "3.12"
      working-directory: python
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
