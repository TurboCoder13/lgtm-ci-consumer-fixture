# lgtm-ci external-consumer fixture — Playwright E2E through
# reusable-test-e2e-playwright.yml with package-manager=bun
# (lgtm-hq/lgtm-ci#804).
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
#
#   e2e            — the reusable under test against playwright/ (one trivial
#                    test on inline content, project `chromium`). The consumer
#                    config's reporter is `json`, so any HTML report must come
#                    from the workflow's own reporter flag.
#   verify-report  — downloads the report artifact the reusable uploaded and
#                    asserts the HTML report is actually inside it. Before #804
#                    the reusable passed `--reporter=html --reporter=json`;
#                    Playwright keeps only the last flag, so playwright-report/
#                    never existed while the e2e job stayed green. It also
#                    lists the run's artifacts through `gh api -X GET` so the
#                    evidence is in the log.
---
name: fixture-playwright

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  e2e:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-e2e-playwright.yml@2097a900753e3e5ad0e336483501b278e99855ae  # v0.78.1
    permissions:
      contents: read
      pull-requests: write
    with:
      egress-policy: block
      job-name: "Playwright E2E (bun)"
      working-directory: playwright
      package-manager: bun
      node-version: "22"
      test-command: bunx playwright test
      project: chromium
      browsers: chromium
      upload-report: true
      # Keep the report on green runs too, so verify-report can prove the
      # HTML report exists after a pass (#804 added upload-report-when).
      upload-report-when: always
      report-artifact-name: playwright-report
      publish-test-summary: false
      runner-image: ubuntu-24.04
      # No allowed-endpoints append on purpose: the default `playwright` preset
      # must carry the runner apt mirror and the Chrome-for-Testing redirect
      # host for `playwright install --with-deps`, so a regression in the
      # preset fails this gate (lgtm-hq/lgtm-ci#1103).

  verify-report:
    name: Verify HTML report artifact
    needs: e2e
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: block
          # GitHub results storage (logs, artifacts, cache): exact hosts,
          # never *.blob.core.windows.net (anyone can register one). Same
          # set as lgtm-ci scripts/ci/lib/egress/presets.sh
          # egress_github_results_storage_endpoints.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
