# lgtm-ci external-consumer fixture — Playwright E2E through
# reusable-test-e2e-playwright.yml with package-manager=bun (lgtm-hq/lgtm-ci#804).
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
#
#   e2e            — the reusable under test against playwright/ (one trivial
#                    test on inline content, project `chromium`). The consumer
#                    config's reporter is `json`, so any HTML report must come
#                    from the workflow's own reporter flag.
#   verify-report  — downloads the report artifact the reusable uploaded and
#                    asserts the HTML report is actually inside it. Before #804
#                    the reusable passed `--reporter=html --reporter=json`;
#                    Playwright keeps only the last flag, so playwright-report/
#                    never existed while the e2e job stayed green. It also
#                    lists the run's artifacts through `gh api -X GET` so the
#                    evidence is in the log.
---
name: fixture-playwright

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  e2e:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-e2e-playwright.yml@c74c9c36914bf02d3771850511b4b44f8eab1984
    permissions:
      contents: read
      pull-requests: write
    with:
      job-name: "Playwright E2E (bun)"
      working-directory: playwright
      package-manager: bun
      node-version: "22"
      test-command: bunx playwright test
      project: chromium
      browsers: chromium
      upload-report: true
      report-artifact-name: playwright-report
      publish-test-summary: false
      runner-image: ubuntu-24.04
      # The `playwright` preset lacks the apt mirror GitHub-hosted ubuntu-24.04
      # runners resolve to, so `playwright install --with-deps` is refused
      # under egress-policy: block (lgtm-hq/lgtm-ci#1103). Append it; the
      # preset itself stays enforced (#913).
      allowed-endpoints-mode: append
      allowed-endpoints: azure.archive.ubuntu.com:80

  verify-report:
    name: Verify HTML report artifact
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: List run artifacts (gh api -X GET)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | "\(.name)\t\(.size_in_bytes) bytes\texpired=\(.expired)"' \
            | tee artifacts.tsv
          grep -q '^playwright-report	' artifacts.tsv ||
            { echo "::error::no playwright-report artifact on this run"; exit 1; }
      - name: Download the report artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playwright-report
          path: report
      - name: Assert the HTML report is inside the artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::artifact contents"
          find report -type f | sort
          echo "::endgroup::"
          test -s report/playwright-report/index.html ||
            { echo "::error::playwright-report/index.html missing from the artifact (#804)"; exit 1; }
          test -s report/playwright-results.json ||
            { echo "::error::playwright-results.json missing from the artifact"; exit 1; }
          echo "HTML report present: $(wc -c <report/playwright-report/index.html) bytes"
