# lgtm-ci external-consumer fixture — two sibling invocations in one run
# Proves artifact namespace isolation between sibling calls (lgtm-ci #752,
# #1091). Both legs run the SAME python-version so every artifact name a leg
# produces would collide without a namespace; each leg passes its own
# artifact-prefix and the final job asserts the full expected artifact set
# (count and names) exists after both legs.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-siblings

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  a:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@04c6b4917390750417f065cd9a05409f67853f70
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Python Tests (a)"
      python-version: "3.12"
      working-directory: python
      coverage: true
      upload-coverage: true
      publish-test-summary: false
      runner-image: ubuntu-24.04
      artifact-prefix: sib_a

  b:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@04c6b4917390750417f065cd9a05409f67853f70
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Python Tests (b)"
      python-version: "3.12"
      working-directory: python
      coverage: true
      upload-coverage: true
      publish-test-summary: false
      runner-image: ubuntu-24.04
      artifact-prefix: sib_b

  artifacts:
    needs: [a, b]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    env:
      # Two legs, each uploading one results summary and one coverage
      # artifact under its own prefix. The API returns one artifact per
      # name, so a collision shows up as a short list, never as a duplicate.
      EXPECTED_COUNT: "4"
      EXPECTED_NAMES: |
        sib_a-coverage
        sib_a-results-3.12
        sib_b-coverage
        sib_b-results-3.12
    steps:
      - name: Require the full artifact set across sibling calls
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api -X GET "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --paginate --jq '.artifacts[] | select(.expired == false) | .name' \
            | sort | tee names.txt
          count="$(wc -l <names.txt | tr -d ' ')"
          if [ "$count" -ne "$EXPECTED_COUNT" ]; then
            echo "::error::expected $EXPECTED_COUNT artifacts across sibling calls, found $count: $(paste -sd, names.txt)"
            exit 1
          fi
          printf '%s\n' "$EXPECTED_NAMES" | sed '/^$/d' | sort >expected.txt
          if ! diff -u expected.txt names.txt; then
            echo "::error::artifact names differ from the expected set"
            exit 1
          fi
          echo "all $count expected artifacts present: $(paste -sd, names.txt)"
