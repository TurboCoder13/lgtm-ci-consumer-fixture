# lgtm-ci external-consumer fixture — Docker multi-platform facade, validate
# path (lgtm-ci #1081). Calls the facade reusable-docker-multiplatform.yml
# with push: false: it delegates to the read-only validate reusable, then its
# own upload-scan-results job uploads each leg's Trivy SARIF to code scanning.
# The caller grants the facade's full union (GitHub checks it statically even
# for push: false); readonly-docker.yml calls the validate file directly with
# contents: read only.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-docker-facade-validate

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  facade:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-docker-multiplatform.yml@8ad9543822dbb8b3a85bcd25f2651a7c7f3320b5  # v0.78.1
    permissions:
      # upload-sarif reads the workflow run (lgtm-hq/lgtm-ci#1310)
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    with:
      egress-policy: block
      matrix: >-
        [{"platform":"linux/amd64","slug":"linux-amd64",
        "runner":"ubuntu-24.04","qemu":false},
        {"platform":"linux/arm64","slug":"linux-arm64",
        "runner":"ubuntu-24.04-arm","qemu":false}]
      context: docker
      file: docker/Dockerfile
      image-name: turbocoder13/lgtm-ci-consumer-fixture/fixture-image
      push: false
      validate-on-pr: true
      smoke-test: "cat /ok"
      scan: true

  check:
    needs: [facade]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      security-events: read
    steps:
      # Only the facade job's result. A failed facade job is reported, not
      # re-asserted: this step fails with only an exit code. lgtm-hq/lgtm-ci's
      # external canary names this step (CANARY_INFRA_DOWNSTREAM_STEPS in
      # scripts/ci/canary/runs.sh) as a downstream report it may excuse after
      # an infrastructure failure, so keep its name, and keep product
      # assertions out of it (lgtm-hq/lgtm-ci#1505).
      - name: Assert the facade validated and uploaded both SARIF categories
        env:
          RESULT: ${{ needs.facade.result }}
        run: |
          echo "facade: result=$RESULT"
          test "$RESULT" = success
      # Product assertions: each failure annotates its own message, and the
      # canary never excuses this step.
      - name: Check the facade uploaded both SARIF categories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/code-scanning/analyses"
          # Only this workflow's own uploads count (docker-scan-failure.yml
          # uploads the same categories on the same ref).
          key=".github/workflows/docker-facade-validate.yml:upload-scan-results"
          if ! analyses="$(gh api -X GET "$api" \
            -f ref="$GITHUB_REF" -f per_page=100 \
            --jq ".[] | select(.analysis_key == \"$key\") | .category")"; then
            echo "::error title=docker-facade-validate::cannot list code-scanning analyses for $GITHUB_REF"
            exit 1
          fi
          echo "$analyses"
          for slug in linux-amd64 linux-arm64; do
            if ! grep -qx "trivy-$slug" <<<"$analyses"; then
              echo "::error title=docker-facade-validate::no code-scanning analysis in category trivy-$slug"
              exit 1
            fi
          done
