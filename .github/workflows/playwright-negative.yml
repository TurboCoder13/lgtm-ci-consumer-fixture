# lgtm-ci external-consumer fixture — Playwright failure path
# (lgtm-hq/lgtm-ci#804). NEGATIVE-BY-DESIGN: the `chromium-failing` project
# holds one test that always fails, so the reusable's e2e job is expected to
# be red. What is under test is the failure-path report artifact: it must
# contain playwright-report/index.html. Before #804 the artifact existed but
# held only playwright-results.json, because the second --reporter flag
# discarded the html reporter.
# workflow_dispatch only: a run that is expected to fail must not redden main.
# Dispatched by playwright-negative-probe.yml, which asserts the failure and deletes this
# run after a pass, so an expected failure does not stay red on the Actions page.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-playwright-negative

"on":
  workflow_dispatch:

permissions: {}

jobs:
  e2e-failing:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-e2e-playwright.yml@2097a900753e3e5ad0e336483501b278e99855ae  # v0.78.1
    permissions:
      contents: read
      pull-requests: write
    with:
      egress-policy: block
      job-name: "Playwright E2E (bun, failing on purpose)"
      working-directory: playwright
      package-manager: bun
      node-version: "22"
      test-command: bunx playwright test
      project: chromium-failing
      browsers: chromium
      upload-report: true
      report-artifact-name: playwright-report-failing
      publish-test-summary: false
      runner-image: ubuntu-24.04
      # No allowed-endpoints append on purpose: the default `playwright` preset
      # must carry the runner apt mirror and the Chrome-for-Testing redirect
      # host for `playwright install --with-deps`, so a regression in the
      # preset fails this gate (lgtm-hq/lgtm-ci#1103).

  verify-report:
    name: Verify failure-path HTML report artifact
    needs: e2e-failing
    # The e2e job is red by design; this job is the verdict.
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # GitHub results storage (logs, artifacts, cache): exact hosts,
          # never *.blob.core.windows.net (anyone can register one). Same
          # set as lgtm-ci scripts/ci/lib/egress/presets.sh
          # egress_github_results_storage_endpoints.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
