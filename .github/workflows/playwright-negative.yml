# lgtm-ci external-consumer fixture — Playwright failure path
# (lgtm-hq/lgtm-ci#804). NEGATIVE-BY-DESIGN: the `chromium-failing` project
# holds one test that always fails, so the reusable's e2e job is expected to
# be red. What is under test is the failure-path report artifact: it must
# contain playwright-report/index.html. Before #804 the artifact existed but
# held only playwright-results.json, because the second --reporter flag
# discarded the html reporter.
# workflow_dispatch only: a run that is expected to fail must not redden main.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-playwright-negative

"on":
  workflow_dispatch:

permissions: {}

jobs:
  e2e-failing:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-e2e-playwright.yml@6e620635b431bd77c262da1f0686724e75df5157
    permissions:
      contents: read
      pull-requests: write
    with:
      job-name: "Playwright E2E (bun, failing on purpose)"
      working-directory: playwright
      package-manager: bun
      node-version: "22"
      test-command: bunx playwright test
      project: chromium-failing
      browsers: chromium
      upload-report: true
      report-artifact-name: playwright-report-failing
      publish-test-summary: false
      runner-image: ubuntu-24.04
      # The `playwright` preset lacks the apt mirror GitHub-hosted ubuntu-24.04
      # runners resolve to, and storage.googleapis.com where cdn.playwright.dev
      # redirects Chrome-for-Testing builds, so `playwright install --with-deps`
      # is refused under egress-policy: block (lgtm-hq/lgtm-ci#1103). Append
      # them; the preset itself stays enforced (#913).
      allowed-endpoints-mode: append
      allowed-endpoints: azure.archive.ubuntu.com:80 storage.googleapis.com:443

  verify-report:
    name: Verify failure-path HTML report artifact
    needs: e2e-failing
    # The e2e job is red by design; this job is the verdict.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: List run artifacts (gh api -X GET)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | "\(.name)\t\(.size_in_bytes) bytes\texpired=\(.expired)"' \
            | tee artifacts.tsv
          grep -q '^playwright-report-failing	' artifacts.tsv ||
            { echo "::error::no playwright-report-failing artifact on this run"; exit 1; }
      - name: Download the report artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playwright-report-failing
          path: report
      - name: Assert the HTML report is inside the artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::artifact contents"
          find report -type f | sort
          echo "::endgroup::"
          test -s report/playwright-report/index.html ||
            { echo "::error::playwright-report/index.html missing from the failure artifact (#804)"; exit 1; }
          test -s report/playwright-results.json ||
            { echo "::error::playwright-results.json missing from the artifact"; exit 1; }
          echo "HTML report present: $(wc -c <report/playwright-report/index.html) bytes"
