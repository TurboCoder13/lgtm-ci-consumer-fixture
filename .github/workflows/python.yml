# lgtm-ci external-consumer fixture — Python test path (reusable-test-python)
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-python

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@178aadf0bd13aa07e0449e0bc6de77dbbff44023
    permissions:
      contents: read
      pull-requests: write
    with:
      job-name: "Python Tests"
      python-version: "3.12"
      working-directory: python
      coverage: true
      upload-coverage: true
      publish-test-summary: false
      runner-image: ubuntu-24.04
