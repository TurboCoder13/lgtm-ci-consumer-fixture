# lgtm-ci external-consumer fixture — Python test path (reusable-test-python)
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
# On pull_request the test-summary comment is enabled so the PR-gated publish
# job (comment, fork guard) actually executes; push behaviour is unchanged.
# `compat` is a real two-leg matrix (python-versions) so the aggregate job's
# artifact-availability wait (lgtm-ci #803) runs against live uploads; the
# wait needs actions:read on every caller of the test reusables.
---
name: fixture-python

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@cc4cd678d2f34b396df27d4e625a8ace3a571f3b
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Python Tests"
      python-version: "3.12"
      working-directory: python
      coverage: true
      upload-coverage: true
      publish-test-summary: ${{ github.event_name == 'pull_request' }}
      runner-image: ubuntu-24.04

  compat:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@cc4cd678d2f34b396df27d4e625a8ace3a571f3b
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Python Compat"
      python-versions: "3.12,3.13"
      working-directory: python
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
