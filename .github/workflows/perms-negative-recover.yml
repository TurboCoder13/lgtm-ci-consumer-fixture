# lgtm-ci external-consumer fixture — NEGATIVE permission test for the
# release-recover facade (lgtm-ci #1081). Grants exactly what the read-only
# plan stage needs (actions: read, contents: read) but calls the facade
# reusable-release-recover.yml with dry-run: false. The facade's resume stage
# declares contents, id-token, attestations and issues write, so GitHub must
# reject the run at parse time: expected startup_failure, before any job (and
# so before anything is published). A run that starts is a finding.
# workflow_dispatch only: a run that is expected to fail must not redden main.
# Calls lgtm-hq/lgtm-ci at an exact SHA, from outside the lgtm-hq org.
# Re-pin with: scripts/pin.sh <sha>
---
name: fixture-perms-negative-recover

"on":
  workflow_dispatch:

permissions: {}

jobs:
  facade-without-resume-scopes:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-recover.yml@03d2a45d886173920b750b41026a118e426cd99a  # v0.78.1
    permissions:
      actions: read
      contents: read
    with:
      egress-policy: block
      tag: v0.0.0
      source-run-id: "1"
      source-workflow: .github/workflows/recover.yml
      dry-run: false
      # v0.78.1
      tooling-ref: 03d2a45d886173920b750b41026a118e426cd99a # lgtm-ci-pin
