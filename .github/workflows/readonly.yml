# lgtm-ci external-consumer fixture — read-only variants (lgtm-ci #1081)
# Each job calls a generated read-only variant (reusable-*-run.yml) granting
# only read scopes: no pull-requests: write. GitHub validates the called
# workflow's permission union at parse time, so this run starting at all
# proves the variant's union is read-only; the check job then asserts the
# variant still ran the tests and reported their outputs. The facade with the
# same grants is perms-negative-node.yml (expected startup_failure).
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-readonly

"on":
  workflow_dispatch:
  push:
    # split-1081-*: pre-merge proof only; dropped when landing on main.
    branches: [main, split-1081-*]

permissions: {}

jobs:
  node:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node-run.yml@08f2cb9a3d5acc2c5e7a6f64050b0f3427bc5b70
    permissions:
      actions: read
      contents: read
    with:
      job-name: "Node Tests (read-only)"
      node-version: "22"
      working-directory: node
      package-manager: bun
      artifact-prefix: node_readonly
      coverage: false
      runner-image: ubuntu-24.04
      post-test-command: >-
        test -z "$(git -C .. status --porcelain)" &&
        echo "tree clean after tests"

  check:
    needs: [node]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Assert the read-only variant ran the tests
        env:
          RESULT: ${{ needs.node.result }}
          PASSED: ${{ needs.node.outputs.passed }}
          TOTAL: ${{ needs.node.outputs.tests-total }}
        run: |
          echo "node: result=$RESULT passed=$PASSED total=$TOTAL"
          test "$RESULT" = success
          test "$PASSED" = true
          test "${TOTAL:-0}" -gt 0
