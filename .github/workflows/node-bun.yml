# lgtm-ci external-consumer fixture — Node test path, package-manager=bun
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
# On pull_request the test-summary comment is enabled so the PR-gated publish
# job (comment, fork guard) actually executes; push behaviour is unchanged.
---
name: fixture-node-bun

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@2134b70042dc51eb5484f7bdedf329680f66f8ea
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Node Tests (bun)"
      node-version: "22"
      working-directory: node
      package-manager: bun
      coverage: false
      publish-test-summary: ${{ github.event_name == 'pull_request' }}
      runner-image: ubuntu-24.04
      # Assertions inside the hardened job: tooling source is present alongside
      # caller source, and only the selected manager touched the tree.
      pre-test-command: >-
        ls ../.lgtm-ci-tooling/.github/actions >/dev/null &&
        ls ../.lgtm-ci-tooling/scripts/ci >/dev/null &&
        echo "tooling checkout present" &&
        test -z "$(git -C .. status --porcelain -- node/bun.lock node/package-lock.json node/pnpm-lock.yaml)" &&
        echo "lockfiles untouched"
      # Final assertion, after vitest ran through the selected manager: the
      # whole tree is clean, so no runner wrote another manager's lockfile or
      # installed tooling into the project (#1077).
      post-test-command: >-
        test -z "$(git -C .. status --porcelain)" &&
        echo "tree clean after tests"
