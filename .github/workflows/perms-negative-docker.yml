# lgtm-ci external-consumer fixture — NEGATIVE permission test for the Docker
# multi-platform facade (lgtm-ci #1081). Grants exactly what readonly-docker.yml
# grants the validate entry (contents: read) but calls the facade
# reusable-docker-multiplatform.yml with push: true. The facade's publish job
# declares packages, id-token, attestations and security-events write, so
# GitHub must reject the run at parse time: expected startup_failure, before
# any job (and so before any push) starts. A run that starts is a finding.
# workflow_dispatch only: a run that is expected to fail must not redden main.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-perms-negative-docker

"on":
  workflow_dispatch:
  # Pre-merge proof on the split branch only; dropped when landing on main.
  push:
    branches: [split-1081-*]

permissions: {}

jobs:
  facade-without-publish-scopes:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-docker-multiplatform.yml@2fc3853ad5e565a7c7c23bf77e4534c095864df1
    permissions:
      contents: read
    with:
      matrix: >-
        [{"platform":"linux/amd64","slug":"linux-amd64",
        "runner":"ubuntu-24.04","qemu":false},
        {"platform":"linux/arm64","slug":"linux-arm64",
        "runner":"ubuntu-24.04-arm","qemu":false}]
      context: docker
      file: docker/Dockerfile
      image-name: turbocoder13/lgtm-ci-consumer-fixture/fixture-image
      push: true
