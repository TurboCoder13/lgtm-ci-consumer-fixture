# lgtm-ci external-consumer fixture — NEGATIVE-by-design Docker scan
# (lgtm-ci #1081). The multi-platform facade validates a deliberately outdated
# image with scan-exit-code "1", so the per-platform builds fail on Trivy
# findings. The point is what happens next: the read-only build job hands its
# SARIF to the facade's upload job, which must still upload it. The verify
# job asserts both trivy-<slug> analyses reached code scanning after this run
# started. Dispatched only by docker-scan-failure-probe.yml, which is green
# exactly when the builds failed and the verify job passed.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-docker-scan-failure

"on":
  workflow_dispatch:

permissions: {}

jobs:
  stamp:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      started: ${{ steps.now.outputs.started }}
    steps:
      - id: now
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

  facade:
    needs: [stamp]
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-docker-multiplatform.yml@5479e741825e8866d7ba577a93305ff3a7e49d33
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    with:
      matrix: >-
        [{"platform":"linux/amd64","slug":"linux-amd64",
        "runner":"ubuntu-24.04","qemu":false},
        {"platform":"linux/arm64","slug":"linux-arm64",
        "runner":"ubuntu-24.04-arm","qemu":false}]
      context: docker
      file: docker/Dockerfile.vulnerable
      image-name: turbocoder13/lgtm-ci-consumer-fixture/fixture-image
      artifact-prefix: scanfail
      push: false
      scan: true
      scan-exit-code: "1"

  verify:
    name: Verify SARIF reached code scanning
    needs: [stamp, facade]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      security-events: read
    steps:
      - name: Assert both analyses were uploaded after this run started
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.facade.result }}
          STARTED: ${{ needs.stamp.outputs.started }}
        run: |
          echo "facade: result=$RESULT started=$STARTED"
          test "$RESULT" = failure
          api="repos/$GITHUB_REPOSITORY/code-scanning/analyses"
          # Only this workflow's own uploads count: docker-facade-validate.yml
          # uploads the same categories on the same ref at the same time
          # (lgtm-ci #1150 review).
          key=".github/workflows/docker-scan-failure.yml:upload-scan-results"
          cats="$(gh api -X GET "$api" -f ref="$GITHUB_REF" -f per_page=100 \
            --jq ".[] | select(.created_at >= \"$STARTED\")
              | select(.analysis_key == \"$key\") | .category")"
          echo "$cats"
          for slug in linux-amd64 linux-arm64; do
            grep -qx "trivy-$slug" <<<"$cats"
          done
