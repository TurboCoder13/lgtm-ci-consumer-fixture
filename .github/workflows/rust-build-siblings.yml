# lgtm-ci external-consumer fixture — two reusable-test-rust-build calls on one ref
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
#
# Proves the rust-build concurrency fix (lgtm-ci #1076): two calls to
# reusable-test-rust-build.yml start concurrently on the same ref. Baseline
# (lgtm-ci main before #1076): the callee's group is rust-build-<ref>, so one
# leg cancels the other. At the fix: the group is namespaced by callee and
# caller workflow and each call carries a distinct concurrency-scope, so both
# complete.
---
name: fixture-rust-build-siblings

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  a:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-rust-build.yml@f78a813e5c71e6bee544b60407ac110325bc7594
    permissions:
      contents: read
    with:
      job-name: "Rust Build (a)"
      concurrency-scope: "a"
      build-script: scripts/rust-release/build-workspace.sh
      egress-policy: block
      egress-preset: build-artifact
      allowed-endpoints-mode: append
      runner-image: ubuntu-24.04

  b:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-rust-build.yml@f78a813e5c71e6bee544b60407ac110325bc7594
    permissions:
      contents: read
    with:
      job-name: "Rust Build (b)"
      concurrency-scope: "b"
      build-script: scripts/rust-release/build-workspace.sh
      egress-policy: block
      egress-preset: build-artifact
      allowed-endpoints-mode: append
      runner-image: ubuntu-24.04
