# TEMP: https://github.com/lgtm-hq/lgtm-ci/issues/1207
# Use audit until step-security/harden-runner#708 is fixed.
# lgtm-ci external-consumer fixture — shared probe for the negative-by-design
# workflows (lgtm-ci #1083). Called by the negative-probe workflows;
# no lgtm-ci reference, so nothing to re-pin.
#
# A job that calls a reusable workflow cannot take `continue-on-error`, and a
# parse-time rejection (`startup_failure`) cannot be caught inside the run at
# all, so each negative is verified from outside: scripts/negative/probe.sh
# dispatches it on this run's ref, waits, asserts the run conclusion and the
# job-level evidence, and deletes the negative run after a pass. The probe is
# green when the negative failed as designed and red when it did not.
---
name: fixture-negative-probe

"on":
  workflow_call:
    inputs:
      negative:
        description: Negative workflow file name under .github/workflows/
        type: string
        required: true
      keep-negative-run:
        description: Keep the negative run after a passing probe
        type: boolean
        default: false

permissions: {}

jobs:
  probe:
    name: Assert ${{ inputs.negative }} fails as designed
    runs-on: ubuntu-26.04
    timeout-minutes: 22
    permissions:
      # Dispatch the negative, read its run and jobs, delete it after a pass.
      actions: write
      # Read the negative jobs' annotations (check-run annotations API).
      checks: read
      # Check out scripts/negative/probe.sh.
      contents: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit  # TEMP: lgtm-hq/lgtm-ci#1207
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Checkout probe script
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/negative
          persist-credentials: false
      - name: Dispatch and assert ${{ inputs.negative }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBE_REF: ${{ github.ref_name }}
          KEEP_NEGATIVE_RUN: ${{ inputs.keep-negative-run }}
          NEGATIVE: ${{ inputs.negative }}
        run: bash scripts/negative/probe.sh "$NEGATIVE"
      - name: Upload negative-run evidence
        if: always()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: negative-evidence
          path: negative-evidence.json
          if-no-files-found: ignore
