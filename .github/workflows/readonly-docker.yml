# lgtm-ci external-consumer fixture — read-only Docker validate entry
# (lgtm-ci #1081).
# Calls reusable-docker-multiplatform-validate.yml with contents: read only:
# native amd64 and arm64 builds without pushing, the local smoke test and a
# Trivy scan. The run starting at all proves the union is read-only; the check
# job asserts both legs produced their docker-trivy-sarif-<slug> artifact
# (default artifact-prefix), which the
# facade would upload to code scanning. The facade with the same grant and
# push: true is perms-negative-docker.yml (expected startup_failure).
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-readonly-docker

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-docker-multiplatform-validate.yml@375684810bdfa99a6e2013141a10a1d7bd46ffc7  # v0.79.2
    permissions:
      contents: read
    with:
      egress-policy: block
      matrix: >-
        [{"platform":"linux/amd64","slug":"linux-amd64",
        "runner":"ubuntu-24.04","qemu":false},
        {"platform":"linux/arm64","slug":"linux-arm64",
        "runner":"ubuntu-24.04-arm","qemu":false}]
      context: docker
      file: docker/Dockerfile
      image-name: turbocoder13/lgtm-ci-consumer-fixture/fixture-image
      validate-on-pr: true
      smoke-test: "cat /ok"
      scan: true

  check:
    needs: [validate]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    steps:
      # Only the validate job's result. A failed validate job is reported, not
      # re-asserted: this step fails with only an exit code. lgtm-hq/lgtm-ci's
      # external canary names this step (CANARY_INFRA_DOWNSTREAM_STEPS in
      # scripts/ci/canary/runs.sh) as a downstream report it may excuse after
      # an infrastructure failure, so keep its name, and keep product
      # assertions out of it (lgtm-hq/lgtm-ci#1505).
      - name: Assert the build passed and both SARIF artifacts exist
        env:
          RESULT: ${{ needs.validate.result }}
        run: |
          echo "validate: result=$RESULT"
          test "$RESULT" = success
      # Product assertions: each failure annotates its own message, and the
      # canary never excuses this step.
      - name: Check both SARIF artifacts exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if ! names="$(gh api -X GET "$run_url/artifacts" \
            --jq '.artifacts[].name')"; then
            echo "::error title=readonly-docker::cannot list this run's artifacts"
            exit 1
          fi
          echo "$names"
          for slug in linux-amd64 linux-arm64; do
            if ! grep -qx "docker-trivy-sarif-$slug" <<<"$names"; then
              echo "::error title=readonly-docker::artifact docker-trivy-sarif-$slug is missing"
              exit 1
            fi
          done
