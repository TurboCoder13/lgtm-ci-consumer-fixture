# lgtm-ci external-consumer fixture — Docker multi-platform facade, push
# path (lgtm-ci #1081).
# Calls the facade reusable-docker-multiplatform.yml with push: true, which
# delegates to the internal publish reusable: native amd64 and arm64 staging
# pushes to this repository's GHCR package, the smoke-test gate, the manifest
# merge with published-manifest verification and provenance attestation, and
# Cosign keyless signing and the scan of the merged digest. The check job
# asserts the real side effect:
# the published index resolves and lists both platforms.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-docker-publish

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: fixture-docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-docker-multiplatform.yml@585fb784b55c6f43256f4cb0bf3e0ee07fd88701  # v0.79.2
    permissions:
      # upload-sarif reads the workflow run (lgtm-hq/lgtm-ci#1310)
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    with:
      egress-policy: block
      matrix: >-
        [{"platform":"linux/amd64","slug":"linux-amd64",
        "runner":"ubuntu-24.04","qemu":false},
        {"platform":"linux/arm64","slug":"linux-arm64",
        "runner":"ubuntu-24.04-arm","qemu":false}]
      context: docker
      file: docker/Dockerfile
      image-name: turbocoder13/lgtm-ci-consumer-fixture/fixture-image
      push: true
      smoke-test: "cat /ok"
      scan: true
      cosign-sign: true

  check:
    needs: [publish]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    steps:
      # Only the publish job's result. A failed publish job is reported, not
      # re-asserted: this step fails with only an exit code. lgtm-hq/lgtm-ci's
      # external canary names this step (CANARY_INFRA_DOWNSTREAM_STEPS in
      # scripts/ci/canary/runs.sh) as a downstream report it may excuse after
      # an infrastructure failure, so keep its name, and keep product
      # assertions out of it (lgtm-hq/lgtm-ci#1505).
      - name: Assert the published index lists both platforms
        env:
          RESULT: ${{ needs.publish.result }}
        run: |
          echo "publish: result=$RESULT"
          test "$RESULT" = success
      # Product assertions: each failure annotates its own message, and the
      # canary never excuses this step.
      - name: Check the published index lists both platforms
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/turbocoder13/lgtm-ci-consumer-fixture/fixture-image
        run: |
          echo "publish: digest=$DIGEST"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=docker-publish::publish digest is not a sha256 digest: '$DIGEST'"
            exit 1
          fi
          if ! echo "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then
            echo "::error title=docker-publish::docker login to ghcr.io failed"
            exit 1
          fi
          if ! inspect="$(docker buildx imagetools inspect "$IMAGE@$DIGEST")"; then
            echo "::error title=docker-publish::cannot inspect $IMAGE@$DIGEST"
            exit 1
          fi
          echo "$inspect"
          for platform in linux/amd64 linux/arm64; do
            if ! grep -q "$platform" <<<"$inspect"; then
              echo "::error title=docker-publish::published index does not list $platform"
              exit 1
            fi
          done
