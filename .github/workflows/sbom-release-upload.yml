      - name: Write SBOM-shaped files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sbom
          printf '{"spdxVersion":"SPDX-2.3","name":"fixture","packages":[]}\n' \
            >sbom/fixture.spdx.json
          printf '%s\n' \
            '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' \
            >sbom/fixture.cdx.json
      - name: Upload SBOM artifact
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom
          if-no-files-found: error
      - name: Create disposable prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --prerelease --notes "fixture" \
            --title "$RELEASE_TAG" --target "$TARGET"
          echo "created $RELEASE_TAG on $TARGET"

  upload:
    name: Upload SBOM release assets (reusable under test)
    needs: prepare
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom-release-upload.yml@2097a900753e3e5ad0e336483501b278e99855ae  # v0.78.1
    permissions:
      contents: write
    with:
      egress-policy: block
      artifact-name: sbom
      release-tag: vfixture-${{ github.run_id }}
      runner-image: ubuntu-24.04

  verify:
    name: Assert assets, then delete release and tag
    needs: [prepare, upload]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
      - name: Assert the SBOM files are attached to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
        run: |
          set -euo pipefail
          echo "reusable upload job result: ${UPLOAD_RESULT}"
          assets=$(gh api -X GET "/repos/${REPO}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' | sort)
          echo "assets on ${RELEASE_TAG}:"
          printf '%s\n' "${assets:-<none>}"
          [[ -n "$assets" ]] || {
            echo "::error::no assets on ${RELEASE_TAG}"
            exit 1
          }
          for f in fixture.cdx.json fixture.spdx.json; do
            grep -qx "$f" <<<"$assets" || {
              echo "::error::missing asset $f"
              exit 1
            }
          done
          [[ "$UPLOAD_RESULT" == "success" ]] \
            || { echo "::error::upload job result ${UPLOAD_RESULT}"; exit 1; }
      - name: Delete the release and its tag
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          echo "deleted $RELEASE_TAG"
