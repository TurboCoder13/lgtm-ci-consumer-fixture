# lgtm-ci external-consumer fixture — SBOM release-asset upload (#935)
# Calls reusable-sbom-release-upload.yml at an exact SHA from outside the
# lgtm-hq org, against a disposable prerelease, and asserts the asset
# actually lands. Re-pin with: scripts/pin.sh <sha>
#
#   prepare  — uploads two small SBOM-shaped files as workflow artifact
#              `sbom` (what reusable-sbom.yml leaves behind in release-assets
#              mode; generating a real SBOM is reusable-sbom.yml's own test,
#              not this one) and creates prerelease `vfixture-<run_id>` on
#              the dispatched commit with github.token — the same token the
#              reusable uploads with.
#   upload   — the reusable under test. Before #935 it fails with
#              `failed to run git: fatal: not a git repository`: the job
#              checks out lgtm-ci tooling only, never this repository, and
#              set no GH_REPO, so gh had no repository to upload to.
#   verify   — reads the release's asset list with `gh api -X GET` and fails
#              unless both files are attached; then deletes the release and
#              its tag whatever the outcome, so nothing accumulates here.
#
# workflow_dispatch only: every run creates and deletes a GitHub Release.
---
name: fixture-sbom-release-upload

"on":
  workflow_dispatch:

permissions: {}

# Per ref: every run uses its own `vfixture-<run_id>` prerelease, so runs on
# different refs never touch each other's release. A repository-wide group
# let concurrent lgtm-ci canaries (one `canary/<sha>` ref each) supersede each
# other's queued run, which then concluded `cancelled` (lgtm-ci #1134).
concurrency:
  group: sbom-release-upload-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: vfixture-${{ github.run_id }}

jobs:
  prepare:
    name: Create prerelease and SBOM artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pipelines.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Write SBOM-shaped files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sbom
          printf '{"spdxVersion":"SPDX-2.3","name":"fixture","packages":[]}\n' \
            >sbom/fixture.spdx.json
          printf '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}\n' \
            >sbom/fixture.cdx.json
      - name: Upload SBOM artifact
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom
          if-no-files-found: error
      - name: Create disposable prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --prerelease --notes "fixture" \
            --title "$RELEASE_TAG" --target "$TARGET"
          echo "created $RELEASE_TAG on $TARGET"

  upload:
    name: Upload SBOM release assets (reusable under test)
    needs: prepare
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom-release-upload.yml@eae062ce40ce20fee8123f1ab609d4c5a57d8be2
    permissions:
      contents: write
    with:
      artifact-name: sbom
      release-tag: vfixture-${{ github.run_id }}
      runner-image: ubuntu-24.04

  verify:
    name: Assert assets, then delete release and tag
    needs: [prepare, upload]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
      - name: Assert the SBOM files are attached to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
        run: |
          set -euo pipefail
          echo "reusable upload job result: ${UPLOAD_RESULT}"
          assets=$(gh api -X GET "/repos/${REPO}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' | sort)
          echo "assets on ${RELEASE_TAG}:"
          printf '%s\n' "${assets:-<none>}"
          [[ -n "$assets" ]] || { echo "::error::no assets on ${RELEASE_TAG}"; exit 1; }
          for f in fixture.cdx.json fixture.spdx.json; do
            grep -qx "$f" <<<"$assets" || { echo "::error::missing asset $f"; exit 1; }
          done
          [[ "$UPLOAD_RESULT" == "success" ]] \
            || { echo "::error::upload job result ${UPLOAD_RESULT}"; exit 1; }
      - name: Delete the release and its tag
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          echo "deleted $RELEASE_TAG"
