# TEMP: https://github.com/lgtm-hq/lgtm-ci/issues/1207
# Use audit until step-security/harden-runner#708 is fixed.
# lgtm-ci external-consumer fixture — single-call target for job re-runs
# (lgtm-ci #803, #717). A workflow cannot re-run its own jobs from inside, so
# convergence is verified from outside with `gh run rerun <run-id> --job <id>`
# — see scripts/rerun-sibling.sh and the README. This workflow exists so a
# re-run of a lone reusable call (no sibling) can be exercised too.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-retry

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@44618ef18f7f597816d2ae30a85a46aac11b4a76  # v0.78.1
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      egress-policy: audit  # TEMP: lgtm-hq/lgtm-ci#1207
      job-name: "Python Tests (retry)"
      python-version: "3.12"
      working-directory: python
      coverage: true
      upload-coverage: true
      publish-test-summary: false
      runner-image: ubuntu-24.04
