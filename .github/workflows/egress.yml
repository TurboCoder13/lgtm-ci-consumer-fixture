# lgtm-ci external-consumer fixture — egress enforcement probes (#913, #412)
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-egress

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  # Explicit allowlist: must pass, and the probe to a non-allowlisted host must
  # be denied inside the hardened job.
  block-explicit-list:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@178aadf0bd13aa07e0449e0bc6de77dbbff44023
    permissions:
      contents: read
      pull-requests: write
    with:
      job-name: "Egress (explicit list)"
      node-version: "22"
      working-directory: node
      package-manager: npm
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
      egress-policy: block
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        registry.npmjs.org:443
      pre-test-command: >-
        if curl -sS --max-time 10 -o /dev/null https://example.com;
        then echo "::error::egress to example.com was NOT blocked"; exit 1;
        else echo "egress to example.com blocked as expected"; fi

  # Preset only: documents the #913 contract. Today the preset never reaches
  # harden-runner, so this job is EXPECTED TO FAIL on main until #913 lands.
  block-preset-only:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@178aadf0bd13aa07e0449e0bc6de77dbbff44023
    permissions:
      contents: read
      pull-requests: write
    with:
      job-name: "Egress (preset only)"
      node-version: "22"
      working-directory: node
      package-manager: npm
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
      egress-policy: block
      egress-preset: github-tooling
      allowed-endpoints: "registry.npmjs.org:443"
      allowed-endpoints-mode: append
