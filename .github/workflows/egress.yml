# lgtm-ci external-consumer fixture — egress enforcement probes (#913, #412)
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
#
# Every job here uses `reusable-test-node.yml` because it exposes
# `pre-test-command`, which runs inside the hardened job after install. The
# probe host is `files.pythonhosted.org`: it is present ONLY in the `pypi`
# preset (not in `github-tooling`, not in GitHub's implicitly-allowed hosts),
# so whether the probe gets through tells you whether the selected preset
# reached harden-runner's pre hook.
---
name: fixture-egress

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  # Explicit allowlist in replace mode: must pass, and the probe to a
  # non-allowlisted host must be denied inside the hardened job.
  block-explicit-list:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@5185136b26b9cb76bcb77d9390ed8c57cfbcb191
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Egress (explicit list)"
      node-version: "22"
      working-directory: node
      package-manager: bun
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
      egress-policy: block
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        registry.npmjs.org:443
      pre-test-command: >-
        if curl -sS --max-time 10 -o /dev/null https://example.com;
        then echo "::error::egress to example.com was NOT blocked"; exit 1;
        else echo "egress to example.com blocked as expected"; fi

  # #913 positive probe: `egress-preset: pypi` + `append`. The probe host is
  # in the pypi preset and nowhere else in this job's inputs, so it is
  # ALLOWED only if the preset is enforced. Expected: DENIED on lgtm-ci main
  # before #913 (preset decorative), ALLOWED once #913 lands.
  preset-pypi-allows-pypi-host:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@5185136b26b9cb76bcb77d9390ed8c57cfbcb191
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Egress (preset pypi → pythonhosted ALLOWED)"
      node-version: "22"
      working-directory: node
      package-manager: bun
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
      egress-policy: block
      egress-preset: pypi
      allowed-endpoints: "registry.npmjs.org:443"
      allowed-endpoints-mode: append
      pre-test-command: >-
        if curl -sS --max-time 10 -o /dev/null https://files.pythonhosted.org/;
        then echo "egress to files.pythonhosted.org ALLOWED (pypi preset enforced)";
        else echo "::error::egress to files.pythonhosted.org DENIED — pypi preset did not reach harden-runner"; exit 1; fi

  # #913 negative control: same inputs but a preset WITHOUT the probe host.
  # Must be DENIED before and after #913 — proves `append` does not grant
  # the union of all presets and that preset *selection* is what enforces.
  preset-github-tooling-denies-pypi-host:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@5185136b26b9cb76bcb77d9390ed8c57cfbcb191
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Egress (preset github-tooling → pythonhosted DENIED)"
      node-version: "22"
      working-directory: node
      package-manager: bun
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
      egress-policy: block
      egress-preset: github-tooling
      allowed-endpoints: "registry.npmjs.org:443"
      allowed-endpoints-mode: append
      pre-test-command: >-
        if curl -sS --max-time 10 -o /dev/null https://files.pythonhosted.org/;
        then echo "::error::egress to files.pythonhosted.org was NOT blocked — preset leaked hosts it does not contain"; exit 1;
        else echo "egress to files.pythonhosted.org blocked as expected (not in github-tooling)"; fi
