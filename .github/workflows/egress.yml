# Branch-only diagnostic replacement; no automatic triggers.
---
name: fixture-egress-dns-diagnostic
run-name: DNS diagnostic — ${{ github.ref_name }}
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixture-dns-1203
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'TurboCoder13/lgtm-ci-consumer-fixture' &&
      github.ref == 'refs/heads/diagnostic/1203-dns-enforcement'
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Collect baseline and begin passive DNS capture
        # Full SHA action reference must remain contiguous.
        # yamllint disable-line rule:line-length
        uses: TurboCoder13/lgtm-ci-consumer-fixture/scripts/network-probe@1461e86226b15f9e67c956e31403c36fe40b3874
        with:
          mode: prepare
      - name: Harden using deployed community pin
        # Full SHA action reference must remain contiguous.
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: |
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: Capture effective resolver before checkout
        if: always()
        # Full SHA action reference must remain contiguous.
        # yamllint disable-line rule:line-length
        uses: TurboCoder13/lgtm-ci-consumer-fixture/scripts/network-probe@1461e86226b15f9e67c956e31403c36fe40b3874
        with:
          mode: snapshot
      - name: Real checkout of dispatched commit
        # Full SHA action reference must remain contiguous.
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Prepare synthetic payload
        # Full SHA action reference must remain contiguous.
        # yamllint disable-line rule:line-length
        uses: TurboCoder13/lgtm-ci-consumer-fixture/scripts/network-probe@1461e86226b15f9e67c956e31403c36fe40b3874
        with:
          mode: payload
      - name: Upload synthetic payload
        # Full SHA action reference must remain contiguous.
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: network-payload-${{ matrix.runner }}
          path: ${{ runner.temp }}/ci1203/payload.txt
          if-no-files-found: error
          retention-days: 90
      - name: Download synthetic payload
        # Full SHA action reference must remain contiguous.
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: network-payload-${{ matrix.runner }}
          path: ${{ runner.temp }}/ci1203-roundtrip
      - name: Verify artifact roundtrip
        # Full SHA action reference must remain contiguous.
        # yamllint disable-line rule:line-length
        uses: TurboCoder13/lgtm-ci-consumer-fixture/scripts/network-probe@1461e86226b15f9e67c956e31403c36fe40b3874
        with:
          mode: roundtrip
      - name: Verify explicitly unallowed traffic is locally blocked
        # Full SHA action reference must remain contiguous.
        # yamllint disable-line rule:line-length
        uses: TurboCoder13/lgtm-ci-consumer-fixture/scripts/network-probe@1461e86226b15f9e67c956e31403c36fe40b3874
        with:
          mode: negative
      - name: Freeze diagnostic evidence even on failure
        if: always()
        # Full SHA action reference must remain contiguous.
        # yamllint disable-line rule:line-length
        uses: TurboCoder13/lgtm-ci-consumer-fixture/scripts/network-probe@1461e86226b15f9e67c956e31403c36fe40b3874
        with:
          mode: finish
      - name: Preserve diagnostic text and checksums
        if: always()
        # Full SHA action reference must remain contiguous.
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: network-diagnostics-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/ci1203/*.txt
            ${{ runner.temp }}/ci1203/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
