# lgtm-ci external-consumer fixture — egress enforcement probes (#913, #412)
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
#
# Every job here uses `reusable-test-node.yml` because it exposes
# `pre-test-command`, which runs inside the hardened job after install. The
# reusable accepts only its default preset, `quality` (lgtm-ci #1623: any
# other `egress-preset` fails at the unknown-preset guard), so the probes use
# hosts that tell whether that preset reached harden-runner's pre hook:
# `files.pythonhosted.org` is in `quality` and in no input of the job, and
# `rubygems.org` is only in the `rubygems` preset.
---
name: fixture-egress

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  # Explicit allowlist in replace mode: must pass, and the probe to a
  # non-allowlisted host must be denied inside the hardened job.
  block-explicit-list:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@8f0fd9339df5d30a529aa572ceb51345b8be33a0  # v0.79.2
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Egress (explicit list)"
      node-version: "22"
      working-directory: node
      package-manager: bun
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
      timeout-minutes: 8
      egress-policy: block
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        registry.npmjs.org:443
      pre-test-command: >-
        if curl -sS --max-time 10 -o /dev/null https://example.com;
        then echo "::error::egress to example.com was NOT blocked"; exit 1;
        else echo "egress to example.com blocked as expected"; fi

  # #913 positive probe: default preset + `append`. The probe host is in
  # the default `quality` preset and nowhere else in this job's inputs, so
  # it is ALLOWED only if the preset is enforced.
  preset-pypi-allows-pypi-host:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@8f0fd9339df5d30a529aa572ceb51345b8be33a0  # v0.79.2
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Egress (default preset → pythonhosted ALLOWED)"
      node-version: "22"
      working-directory: node
      package-manager: bun
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
      timeout-minutes: 8
      egress-policy: block
      allowed-endpoints: "registry.npmjs.org:443"
      allowed-endpoints-mode: append
      pre-test-command: >-
        if curl -sS --max-time 10 -o /dev/null https://files.pythonhosted.org/;
        then echo "egress to files.pythonhosted.org ALLOWED (default preset
        enforced)";
        else echo "::error::egress to files.pythonhosted.org DENIED — the
        default preset did not reach harden-runner"; exit 1; fi

  # #913 negative control: same inputs, probing a host that only another
  # preset (`rubygems`) has. Must be DENIED — proves `append` does not grant
  # the union of all presets.
  preset-default-denies-rubygems-host:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@8f0fd9339df5d30a529aa572ceb51345b8be33a0  # v0.79.2
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Egress (default preset → rubygems DENIED)"
      node-version: "22"
      working-directory: node
      package-manager: bun
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
      timeout-minutes: 8
      egress-policy: block
      allowed-endpoints: "registry.npmjs.org:443"
      allowed-endpoints-mode: append
      pre-test-command: >-
        if curl -sS --max-time 10 -o /dev/null https://rubygems.org/;
        then echo "::error::egress to rubygems.org was NOT blocked — the
        preset leaked hosts it does not contain"; exit 1;
        else echo "egress to rubygems.org blocked as expected (not in
        quality)"; fi
