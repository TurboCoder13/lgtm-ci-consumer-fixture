# lgtm-ci external-consumer fixture — egress enforcement probes (#913, #412)
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-egress

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  # Explicit allowlist: must pass, and the probe to a non-allowlisted host must
  # be denied inside the hardened job.
  block-explicit-list:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@87e1bf19a91e92c13285b9f81e4931708fb7199d
    permissions:
      contents: read
      pull-requests: write
    with:
      job-name: "Egress (explicit list)"
      node-version: "22"
      working-directory: node
      package-manager: bun
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
      egress-policy: block
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        registry.npmjs.org:443
      pre-test-command: >-
        if curl -sS --max-time 10 -o /dev/null https://example.com;
        then echo "::error::egress to example.com was NOT blocked"; exit 1;
        else echo "egress to example.com blocked as expected"; fi

  # Preset only: documents the #913 contract. The preset never reaches
  # harden-runner today, yet this job still passes because harden-runner
  # allows GitHub's own hosts implicitly. #913's acceptance test must therefore
  # probe a host that exists ONLY in the selected preset (allowed after the
  # fix, denied before), rather than expect this job to fail.
  block-preset-only:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@87e1bf19a91e92c13285b9f81e4931708fb7199d
    permissions:
      contents: read
      pull-requests: write
    with:
      job-name: "Egress (preset only)"
      node-version: "22"
      working-directory: node
      package-manager: bun
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
      egress-policy: block
      egress-preset: github-tooling
      allowed-endpoints: "registry.npmjs.org:443"
      allowed-endpoints-mode: append
