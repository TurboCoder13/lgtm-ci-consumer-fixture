# lgtm-ci external-consumer fixture — security audit path
# (reusable-security-audit + reusable-publish-security-audit-comment).
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
# Audits the python/ project; python/.osv-scanner.toml carries one stale
# suppression so the PR comment exercises probe-derived status (lgtm-ci #825).
# On pull_request the comment artifact is uploaded and the publish job posts it.
---
name: fixture-security-audit

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  audit:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-security-audit.yml@ae41597c267395a0bd9351a6c149a3bfde38edf7
    permissions:
      contents: read
      packages: read
    with:
      job-name: "Security Audit"
      working-directory: python
      runner-image: ubuntu-24.04

  publish:
    needs: audit
    if: always() && github.event_name == 'pull_request'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-security-audit-comment.yml@ae41597c267395a0bd9351a6c149a3bfde38edf7
    permissions:
      contents: read
      pull-requests: write
    with:
      job-name: "Publish security audit comment"
