# lgtm-ci external-consumer fixture — well-behaved version-update-script
# (reusable-release-version-pr, lgtm-hq/lgtm-ci#849)
# Same call as release-version-pr.yml, plus `version-update-script:
# scripts/benign-hook.sh`. The hook rewrites the tracked HOOK_RELEASE_INFO.txt
# from NEXT_VERSION and the read-only release-metadata.json lgtm-ci provides,
# and asserts its sandbox (no token, tooling not writable).
#
# EXPECTED after #849: the run opens a version PR whose diff contains the
# python bump, CHANGELOG and HOOK_RELEASE_INFO.txt, produced by the
# `version-update-hook` job and applied by `Create Version PR`.
#
# Any PR this run opens is closed and its branch deleted by hand right after.
# workflow_dispatch only. Calls lgtm-hq/lgtm-ci at an exact SHA with NO
# tooling-ref, from outside the lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-release-benign-hook

"on":
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr-hooked:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@7362363da2b064b754533eff380455ddc25b1387
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
    with:
      ecosystems: python
      ecosystem-config: >-
        {"python": {"pyproject": "python/pyproject.toml"}}
      max-bump: minor
      auto-merge: false
      pr-labels: fixture
      report-failures: false
      version-update-script: scripts/benign-hook.sh
      egress-policy: block
      allowed-endpoints: >-
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        pypi.org:443
        files.pythonhosted.org:443
      runner-image: ubuntu-24.04
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
