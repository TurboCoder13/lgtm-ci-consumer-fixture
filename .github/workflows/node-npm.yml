# lgtm-ci external-consumer fixture — Node test path, package-manager=npm
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-node-npm

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@940ae9fad82b5ef9f91ac02d1798ab1099cbfa2e
    permissions:
      contents: read
      pull-requests: write
    with:
      job-name: "Node Tests (npm)"
      node-version: "22"
      working-directory: node
      package-manager: npm
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
      # Assertions inside the hardened job: tooling source is present alongside
      # caller source, and only the selected manager touched the tree.
      pre-test-command: >-
        ls ../.lgtm-ci-tooling/.github/actions >/dev/null &&
        ls ../.lgtm-ci-tooling/scripts/ci >/dev/null &&
        echo "tooling checkout present" &&
        test -z "$(git -C .. status --porcelain -- node/bun.lock node/package-lock.json)" &&
        echo "lockfiles untouched"
