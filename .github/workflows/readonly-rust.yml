# lgtm-ci external-consumer fixture — read-only Rust variant (lgtm-ci #1081)
# Calls the generated read-only variant reusable-rust-test-run.yml granting
# only read scopes: no pull-requests: write. GitHub validates the called
# workflow's permission union at parse time, so this run starting at all
# proves the variant's union is read-only; the check job then asserts the
# variant still ran the tests and reported their outputs. The facade with the
# same grants is perms-negative-rust.yml (expected startup_failure).
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-readonly-rust

"on":
  workflow_dispatch:
  push:
    # split-1081-*: pre-merge proof only; dropped when landing on main.
    branches: [main, split-1081-*]

permissions: {}

jobs:
  rust:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-rust-test-run.yml@f8bc005e20b47263798103eeb9f56b240f323e14
    permissions:
      actions: read
      contents: read
    with:
      job-name: "Rust Tests (read-only)"
      rust-toolchain: stable
      working-directory: rust
      artifact-prefix: rust_readonly
      coverage: false
      runner-image: ubuntu-24.04

  check:
    needs: [rust]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Assert the read-only variant ran the tests
        env:
          RESULT: ${{ needs.rust.result }}
          PASSED: ${{ needs.rust.outputs.passed }}
          TOTAL: ${{ needs.rust.outputs.tests-total }}
        run: |
          echo "rust: result=$RESULT passed=$PASSED total=$TOTAL"
          test "$RESULT" = success
          test "$PASSED" = true
          test "${TOTAL:-0}" -gt 0
