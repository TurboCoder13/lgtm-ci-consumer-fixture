# SPDX-License-Identifier: MIT
# Starter CI for a Python (uv/pytest) repository using lgtm-ci reusables.
# Copy into your repository as .github/workflows/ci.yml.
# Permissions per docs/workflow-contract.md "Permissions by mode".
# Quality summary is a split caller job with a fork-PR guard; the test
# reusable routes its PR comment through an internal publish-test-summary
# job (contract: "Permissions split").
---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@d0284c46f904bfa8669d206869e5c87cd4662fcd # v0.75.3
    permissions:
      contents: read
      packages: read
    with:
      job-name: "🛠️ Lintro Code Quality"
      working-directory: python
      egress-policy: block
      egress-preset: quality

  publish-quality-summary:
    needs: quality
    # Fork PRs cannot post comments (contract: "Fork PR summaries and reports")
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@d0284c46f904bfa8669d206869e5c87cd4662fcd # v0.75.3
    permissions:
      contents: read
      pull-requests: write
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}

  test:
    # Coverage mode: single python-version + coverage: true (contract:
    # "Compat vs coverage contract"). For a compat matrix instead, pass
    # python-versions: "3.11,3.12,3.13" with coverage/publish disabled.
    # Releases that include #1021 install with `uv sync --frozen` from the
    # committed uv.lock. Only if an extra you install pulls a PRIVATE git
    # dependency, forward a token explicitly at job level, next to `with:`
    # (never `secrets: inherit`). Requires a pin that includes #1021:
    #   secrets:
    #     GIT_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@d0284c46f904bfa8669d206869e5c87cd4662fcd # v0.75.3
    permissions:
      # actions: read — the aggregate job's artifact-availability wait (#803)
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Python Tests"
      working-directory: python
      python-version: "3.12"
      coverage: true
      upload-coverage: true
      publish-test-summary: true
      runner-image: ubuntu-24.04
      egress-policy: block
      egress-preset: pypi
