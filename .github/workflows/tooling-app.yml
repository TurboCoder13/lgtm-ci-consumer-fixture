# lgtm-ci external-consumer fixture — tooling App credential (lgtm-ci #1622)
# Calls a converted lgtm-ci reusable, reusable-validate-action-pinning.yml,
# from outside the lgtm-hq org, twice:
#
#   app-pair  forwards LGTM_CI_TOOLING_APP_CLIENT_ID and
#             LGTM_CI_TOOLING_APP_PRIVATE_KEY. The job must run "Check tooling
#             App credential", mint a token in "Mint tooling App token" (App
#             lgtm-ci-tooling-reader: Contents read-only, installed on
#             lgtm-hq/lgtm-ci only), check the tooling out with it and revoke
#             it in the post step.
#   no-app    forwards nothing. Both App steps are skipped and the tooling
#             checkout falls back to github.token, as before #1622.
#
# The assert job reads both called jobs' steps through the jobs API and checks
# each step's conclusion (scripts/tooling-app/assert-steps.sh), the absence of
# the minting action's "Token revocation failed" warning, and the "Token
# revoked" line in the app-pair job log. The post step also succeeds when it
# skips revocation (no token, token expired, skip-token-revoke), so only that
# line proves the DELETE /installation/token call. The log is fetched through
# `GET /actions/jobs/{id}/logs`, which redirects to GitHub's results storage,
# hence the explicit productionresultssa<N> hosts in the assert allow-list; the
# log is grepped for that one marker and never printed.
#
# The one-secret case is tooling-app-negative.yml, dispatched by
# tooling-app-negative-probe.yml. The mint-skipped-because-no-consumer case
# (LGTM_CI_TOOLING_APP_NEEDED false) cannot run here: no converted reusable
# sets it false on a dispatch (the pilot only on merge_group, and this
# repository has no merge queue; reusable-test-python.yml only on
# pull_request with pipeline-skip).
#
# The validation itself is not under test: fail-on-error and verify-tags are
# off so the called job's result depends on the tooling path only.
# workflow_dispatch only; no secret is printed. Calls lgtm-hq/lgtm-ci at an
# exact SHA with NO tooling-ref.
# Re-pin with: scripts/pin.sh <sha>
---
name: fixture-tooling-app

"on":
  workflow_dispatch:

permissions: {}

jobs:
  app-pair:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@3d2d9d665e39171da6ac3ca26518686525507257  # v0.109.0
    permissions:
      contents: read
    with:
      job-name: "Tooling App pair"
      fail-on-error: false
      verify-tags: false
      egress-policy: block
    secrets:
      # yamllint disable-line rule:line-length
      LGTM_CI_TOOLING_APP_CLIENT_ID: ${{ secrets.LGTM_CI_TOOLING_APP_CLIENT_ID }}
      # yamllint disable-line rule:line-length
      LGTM_CI_TOOLING_APP_PRIVATE_KEY: ${{ secrets.LGTM_CI_TOOLING_APP_PRIVATE_KEY }}

  no-app:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@3d2d9d665e39171da6ac3ca26518686525507257  # v0.109.0
    permissions:
      contents: read
    with:
      job-name: "No tooling App"
      fail-on-error: false
      verify-tags: false
      egress-policy: block

  assert:
    name: Assert tooling App steps
    needs: [app-pair, no-app]
    # Judge the step evidence even when a called job failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      # List this run's jobs and their steps; read the app-pair job log.
      actions: read
      # Read the app-pair job's annotations (check-run annotations API).
      checks: read
      # Check out scripts/tooling-app/assert-steps.sh.
      contents: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          # GitHub results storage (logs, artifacts, cache): exact hosts,
          # never *.blob.core.windows.net (anyone can register one). Same
          # set as lgtm-ci scripts/ci/lib/egress/presets.sh
          # egress_github_results_storage_endpoints.
