# lgtm-ci external-consumer fixture — private git dependency probe (#1021)
# `python-private-dep/` declares a git dependency on a PRIVATE sibling repo
# (TurboCoder13/trader-service) in dependency group `engine`, which this job
# never installs, and its uv.lock is stale on purpose (version bumped without
# `uv lock`, the shape that broke trader-service's own main). No secret is
# passed. On lgtm-ci main before #1021 the install step runs a plain `uv sync`,
# re-resolves the stale lock, and fails with
#   fatal: could not read Username for 'https://github.com'
# After #1021 the step runs `uv sync --frozen` and never touches `engine`.
# Dispatch only. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-python-private-dep

"on":
  workflow_dispatch:

permissions: {}

jobs:
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@0ee8ea9e6c8e9d7d7a740eafe2892286f69a96b7  # v0.78.1
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      egress-policy: block
      job-name: "Python Tests (private dep, no secret)"
      python-version: "3.12"
      working-directory: python-private-dep
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
