# TEMP: https://github.com/lgtm-hq/lgtm-ci/issues/1207
# Use audit until step-security/harden-runner#708 is fixed.
# lgtm-ci external-consumer fixture — workflow lint (reusable-quality-lint)
# Runs Lintro's actionlint over every file in .github/workflows. The only
# other quality-lint caller (starter-python.yml) lints `python/`, where Lintro
# never sees the workflows, so actionlint was not in its detected toolset.
# Re-pin with: scripts/pin.sh <sha>
---
name: fixture-workflow-lint

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@2097a900753e3e5ad0e336483501b278e99855ae  # v0.78.1
    permissions:
      contents: read
      packages: read
    with:
      job-name: "Actionlint"
      working-directory: "."
      tools: actionlint
      egress-policy: audit  # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: quality
