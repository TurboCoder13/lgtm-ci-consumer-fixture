# lgtm-ci external-consumer fixture — Rust release binaries (reusable-build-rust-binaries)
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
#
# Dispatch-only. Builds the fixture's rust/ crate with the reusable's DEFAULT
# target matrix (build-script / package-script step into rust/ and exec the
# lgtm-ci defaults unchanged), then a windows-latest job downloads the
# Windows artifact and executes fixture-rs.exe, expecting it to print 5.
# Baseline (lgtm-ci main before #1076): the Windows leg fails at the build
# step because the default matrix paired x86_64-pc-windows-msvc with cross.
---
name: fixture-rust-release-build

"on":
  workflow_dispatch:

permissions: {}

jobs:
  build:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-rust-binaries.yml@cc4cd678d2f34b396df27d4e625a8ace3a571f3b
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      packages: fixture-rs
      binary-names: fixture-rs
      version-file: rust/Cargo.toml
      build-script: scripts/rust-release/build.sh
      package-script: scripts/rust-release/package.sh
      artifact-prefix: fixture-rs
      retention-days: 3

  windows-smoke:
    needs: build
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: Download the Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixture-rs-x86_64-pc-windows-msvc
          path: dist
      - name: Verify checksum, unzip and execute fixture-rs.exe
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          Set-Location dist
          $zip = "fixture-rs-$env:VERSION-x86_64-pc-windows-msvc.zip"
          $expected = (Get-Content SHA256SUMS-x86_64-pc-windows-msvc).Split(' ')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "checksum mismatch: $expected != $actual" }
          Expand-Archive $zip -DestinationPath out
          $output = (& .\out\fixture-rs.exe | Out-String).Trim()
          Write-Host "fixture-rs.exe printed: $output"
          if ($output -ne "5") { throw "expected 5, got '$output'" }
