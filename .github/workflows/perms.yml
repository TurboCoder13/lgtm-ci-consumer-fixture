# TEMP: https://github.com/lgtm-hq/lgtm-ci/issues/1207
# Use audit until step-security/harden-runner#708 is fixed.
# lgtm-ci external-consumer fixture — documented-minimum caller permissions
# (#735, #736). actions:read + contents:read + pull-requests:write is the
# documented block for test reusables on push; the internal publish job declares
# pull-requests:write even when disabled, the aggregate job declares actions:read
# for its artifact-availability wait (#803), and GitHub validates both at parse
# time.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-perms

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  documented-minimum:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@ddd98f9f9c9024cfbe85c3b9704f3d5cbd899346  # v0.78.1
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      egress-policy: audit  # TEMP: lgtm-hq/lgtm-ci#1207
      job-name: "Python Tests (documented perms)"
      python-version: "3.12"
      working-directory: python
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04
