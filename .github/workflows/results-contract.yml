# lgtm-ci external-consumer fixture — results contract (lgtm-ci #1080)
# Every runner leg must expose a results/**/results.json artifact that
# validates against schemas/results.v1.json. Baseline-impossible on lgtm-ci
# main before #1080: no runner uploaded a results.json, so this job cannot
# pass against a pre-#1080 pin by construction.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-results-contract

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  python:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@8f0fd9339df5d30a529aa572ceb51345b8be33a0  # v0.79.2
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      egress-policy: block
      job-name: "Python Tests (contract)"
      python-version: "3.12"
      working-directory: python
      artifact-prefix: rcpy
      coverage: true
      upload-coverage: true
      publish-test-summary: false
      runner-image: ubuntu-24.04

  python-compat:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@8f0fd9339df5d30a529aa572ceb51345b8be33a0  # v0.79.2
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      egress-policy: block
      job-name: "Python Compat (contract)"
      python-versions: "3.12,3.13"
      working-directory: python
      artifact-prefix: rccompat
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04

  node:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@8f0fd9339df5d30a529aa572ceb51345b8be33a0  # v0.79.2
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      egress-policy: block
      job-name: "Node Tests (contract)"
      node-version: "22"
      working-directory: node
      package-manager: bun
      artifact-prefix: rcnode
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04

  rust:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-rust-test.yml@8f0fd9339df5d30a529aa572ceb51345b8be33a0  # v0.79.2
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      egress-policy: block
      job-name: "Rust Tests (contract)"
      rust-toolchain: stable
      working-directory: rust
      artifact-prefix: rcrust
      coverage: true
      publish-test-summary: false
      runner-image: ubuntu-24.04

  playwright:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-e2e-playwright.yml@18bc1ead55f068853546660565a597fbbc4354aa  # v0.111.1
    permissions:
      contents: read
      pull-requests: write
    with:
      egress-policy: block
      job-name: "Playwright E2E (contract)"
      working-directory: playwright
      package-manager: bun
      node-version: "22"
      test-command: bunx playwright test
      project: chromium
      browsers: chromium
      # Skip apt when ldd finds every shared library (lgtm-ci #1433).
      system-deps: if-missing
      upload-report: false
      report-artifact-name: rc-playwright-report
      results-artifact-name: rc-playwright-results
      publish-test-summary: false
      runner-image: ubuntu-24.04
      allowed-endpoints-mode: append
      allowed-endpoints: azure.archive.ubuntu.com:80 storage.googleapis.com:443

  gate:
    # The required-check reusable reads the documents too (lgtm-ci #1080).
    needs: [python, python-compat, node, rust]
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-required-check.yml@8f0fd9339df5d30a529aa572ceb51345b8be33a0  # v0.79.2
    permissions:
      contents: read
    with:
      egress-policy: block
      job-name: "Results gate"
      upstream-result: ${{ needs.python.result }}
      passed-output: ${{ needs.python.outputs.passed }}
      results-artifact-pattern: "rc*-results-*"
      results-expected-count: "5"

  validate:
    name: Validate results.v1 artifacts
    needs: [python, python-compat, node, rust, playwright]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        # v2.22.3
        uses: >-
          step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: block
          # GitHub results storage (logs, artifacts, cache): exact hosts,
          # never *.blob.core.windows.net (anyone can register one). Same
          # set as lgtm-ci scripts/ci/lib/egress/presets.sh
          # egress_github_results_storage_endpoints.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
