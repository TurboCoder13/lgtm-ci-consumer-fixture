# lgtm-ci external-consumer fixture — results contract (lgtm-ci #1080)
# Every runner leg must expose a results/**/results.json artifact that
# validates against schemas/results.v1.json. Baseline-impossible on lgtm-ci
# main before #1080: no runner uploaded a results.json, so this job cannot
# pass against a pre-#1080 pin by construction.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-results-contract

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  python:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@5185136b26b9cb76bcb77d9390ed8c57cfbcb191
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Python Tests (contract)"
      python-version: "3.12"
      working-directory: python
      artifact-prefix: rcpy
      coverage: true
      upload-coverage: true
      publish-test-summary: false
      runner-image: ubuntu-24.04

  python-compat:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@5185136b26b9cb76bcb77d9390ed8c57cfbcb191
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Python Compat (contract)"
      python-versions: "3.12,3.13"
      working-directory: python
      artifact-prefix: rccompat
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04

  node:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@5185136b26b9cb76bcb77d9390ed8c57cfbcb191
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Node Tests (contract)"
      node-version: "22"
      working-directory: node
      package-manager: bun
      artifact-prefix: rcnode
      coverage: false
      publish-test-summary: false
      runner-image: ubuntu-24.04

  rust:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-rust-test.yml@5185136b26b9cb76bcb77d9390ed8c57cfbcb191
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      job-name: "Rust Tests (contract)"
      rust-toolchain: stable
      working-directory: rust
      artifact-prefix: rcrust
      coverage: true
      publish-test-summary: false
      runner-image: ubuntu-24.04

  playwright:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-e2e-playwright.yml@5185136b26b9cb76bcb77d9390ed8c57cfbcb191
    permissions:
      contents: read
      pull-requests: write
    with:
      job-name: "Playwright E2E (contract)"
      working-directory: playwright
      package-manager: bun
      node-version: "22"
      test-command: bunx playwright test
      project: chromium
      browsers: chromium
      upload-report: false
      report-artifact-name: rc-playwright-report
      results-artifact-name: rc-playwright-results
      publish-test-summary: false
      runner-image: ubuntu-24.04
      allowed-endpoints-mode: append
      allowed-endpoints: azure.archive.ubuntu.com:80 storage.googleapis.com:443

  gate:
    # The required-check reusable reads the documents too (lgtm-ci #1080).
    needs: [python, python-compat, node, rust]
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-required-check.yml@5185136b26b9cb76bcb77d9390ed8c57cfbcb191
    permissions:
      contents: read
    with:
      job-name: "Results gate"
      upstream-result: ${{ needs.python.result }}
      passed-output: ${{ needs.python.outputs.passed }}
      results-artifact-pattern: "rc*-results-*"
      results-expected-count: "5"

  validate:
    name: Validate results.v1 artifacts
    needs: [python, python-compat, node, rust, playwright]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Checkout lgtm-ci tooling (schema + validator)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lgtm-hq/lgtm-ci
          ref: 5185136b26b9cb76bcb77d9390ed8c57cfbcb191 # lgtm-ci-pin
          path: .lgtm-ci-tooling
          sparse-checkout: |
            schemas/
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Show tooling checkout
        shell: bash
        run: find .lgtm-ci-tooling -maxdepth 4 -type d | sort | head -40
      - name: List run artifacts (gh api -X GET)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | "\(.name)\t\(.size_in_bytes) bytes"' | tee artifacts.tsv
      - name: Download every results artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "rc*results*"
          path: results-download
          merge-multiple: false
      - name: Validate every results.json against schemas/results.v1.json
        shell: bash
        run: |
          set -euo pipefail
          source .lgtm-ci-tooling/scripts/ci/lib/testing/results.sh
          echo "::group::downloaded documents"
          find results-download -type f | sort
          echo "::endgroup::"
          expected="rcpy-results-3.12 rccompat-results-3.12 rccompat-results-3.13 rcnode-results-22 rcrust-results-stable rc-playwright-results"
          failed=0
          for name in $expected; do
            doc="results-download/${name}/results.json"
            if [[ ! -f "$doc" ]]; then
              echo "::error::${name}: no results.json in the artifact (#1080)"; failed=1; continue
            fi
            if results_v1_validate "$doc"; then
              echo "ok ${name}: $(jq -c '{tool,status,counts,coverage}' "$doc")"
            else
              echo "::error::${name}: results.json does not validate against results.v1"; failed=1
            fi
            [[ "$(jq -r .status "$doc")" == "passed" ]] ||
              { echo "::error::${name}: status $(jq -r .status "$doc") is not passed"; failed=1; }
          done
          exit "$failed"
