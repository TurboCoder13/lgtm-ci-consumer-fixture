      - name: Checkout lgtm-ci tooling (schema + validator)
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lgtm-hq/lgtm-ci
          # v0.79.2
          ref: 8f0fd9339df5d30a529aa572ceb51345b8be33a0  # lgtm-ci-pin
          path: .lgtm-ci-tooling
          sparse-checkout: |
            schemas/
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Show tooling checkout
        shell: bash
        run: find .lgtm-ci-tooling -maxdepth 4 -type d | sort | head -40
      - name: List run artifacts (gh api -X GET)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | "\(.name)\t\(.size_in_bytes) bytes"' \
            | tee artifacts.tsv
      - name: Download every results artifact
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: "rc*results*"
          path: results-download
          merge-multiple: false
      - name: Validate every results.json against schemas/results.v1.json
        shell: bash
        run: |
          set -euo pipefail
          source .lgtm-ci-tooling/scripts/ci/lib/testing/results.sh
          echo "::group::downloaded documents"
          find results-download -type f | sort
          echo "::endgroup::"
          expected="rcpy-results-3.12 rccompat-results-3.12"
          expected+=" rccompat-results-3.13 rcnode-results-22"
          expected+=" rcrust-results-stable rc-playwright-results"
          failed=0
          for name in $expected; do
            doc="results-download/${name}/results.json"
            if [[ ! -f "$doc" ]]; then
              echo "::error::${name}: no results.json in the artifact (#1080)"
              failed=1
              continue
            fi
            if results_v1_validate "$doc"; then
              echo "ok ${name}: $(jq -c '{tool,status,counts,coverage}' "$doc")"
            else
              echo "::error::${name}: results.json does not validate" \
                "against results.v1"
              failed=1
            fi
            [[ "$(jq -r .status "$doc")" == "passed" ]] ||
              {
                echo "::error::${name}: status" \
                  "$(jq -r .status "$doc") is not passed"
                failed=1
              }
          done
          exit "$failed"
