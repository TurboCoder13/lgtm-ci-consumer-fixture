# lgtm-ci external-consumer fixture — read-only shell variant (lgtm-ci #1081)
# Calls the generated read-only variant reusable-test-shell-run.yml granting
# only read scopes: no pull-requests: write. GitHub validates the called
# workflow's permission union at parse time, so this run starting at all
# proves the variant's union is read-only; the check job then asserts the
# variant still ran the tests and reported their outputs. The facade with the
# same grants is perms-negative-shell.yml (expected startup_failure).
# The `required` job wraps the `shell` job with reusable-required-check.yml
# (lgtm-hq/lgtm-ci#1375): one named context, `required / Shell Tests
# (read-only) required`, that is green only when `shell` succeeded and
# reported `passed`. It runs on pull_request too, so the PR proves it.
# Calls lgtm-hq/lgtm-ci at an exact SHA with NO tooling-ref, from outside the
# lgtm-hq org. Re-pin with: scripts/pin.sh <sha>
---
name: fixture-readonly-shell

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  shell:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-shell-run.yml@2610421c4ef9aa750c4339f5f274687e087029fe  # v0.78.1
    permissions:
      actions: read
      contents: read
    with:
      egress-policy: block
      job-name: "Shell Tests (read-only)"
      working-directory: shell
      test-path: tests/bats
      artifact-prefix: shell_readonly
      coverage: false
      runner-image: ubuntu-24.04

  check:
    needs: [shell]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Assert the read-only variant ran the tests
        env:
          RESULT: ${{ needs.shell.result }}
          PASSED: ${{ needs.shell.outputs.passed }}
          TOTAL: ${{ needs.shell.outputs.tests-total }}
        run: |
          echo "shell: result=$RESULT passed=$PASSED total=$TOTAL"
          test "$RESULT" = success
          test "$PASSED" = true
          test "${TOTAL:-0}" -gt 0

  required:
    needs: [shell]
    if: always()
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-required-check.yml@2610421c4ef9aa750c4339f5f274687e087029fe  # v0.78.1
    permissions:
      contents: read
    with:
      egress-policy: block
      job-name: "Shell Tests (read-only) required"
      upstream-result: ${{ needs.shell.result == 'success' && needs.shell.outputs.passed == 'true' && 'success' || 'failure' }}
      passed-output: ${{ needs.shell.outputs.passed }}
      runner-image: ubuntu-24.04
