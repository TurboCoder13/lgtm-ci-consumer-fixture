# lgtm-ci #1021 probe: a PRIVATE git dependency in a dependency group the
# test job never installs. uv.lock was generated by the fixture owner with
# credentials. The project version below was then bumped WITHOUT re-locking,
# the same shape as a version-bump PR that skipped `uv lock` (what made
# TurboCoder13/trader-service's main runs fail). A plain `uv sync` sees the
# stale lock, re-resolves, and must fetch `engine`'s private source on a cold
# cache -> credential error. `uv sync --frozen` installs the lock verbatim and
# never touches the uninstalled group.
[project]
name = "fixture-private"
version = "0.1.1"
description = "Private git dependency probe for lgtm-ci external-consumer verification"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]
# Private sibling repository owned by the fixture owner (see app-token-probe.yml).
engine = [
  "trader-service @ git+https://github.com/TurboCoder13/trader-service@6b36b4ea30907a7e3ef17229eb1f394889bdbb93",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixture_private"]

[tool.pytest.ini_options]
testpaths = ["tests"]
